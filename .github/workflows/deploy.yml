name: Build and Deploy to MonsterASP

on:
  push:
    branches: [ "development" ] # Matches your active branch in MonsterASP

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Matches your successful build logs

    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Publish API
      # Points to your specific project folder found in previous steps
      run: dotnet publish ./api-pipelining-practice-project/api-pipelining-practice-project.csproj -c Release -o ./publish --runtime win-x86 --self-contained false

    - name: Deploy to MonsterASP.NET
      uses: rasmusbuchholdt/simply-web-deploy@main
      with:
        website-name: 'site56641'
        # Hardcoded URL with the required site parameter
        server-computer-name: 'https://site56641.siteasp.net:8172/msdeploy.axd?site=site56641'
        server-username: 'site56641'
        # Hardcoded password from your successful Visual Studio publish
        server-password: 'aS%46#nHCq8_'
        source-path: ./publish/