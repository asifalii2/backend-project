name: Build and Deploy to MonsterASP

on:
  push:
    branches: [ "development" ] # Updated to match your screenshot

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Publish API
      # Using the path to your .csproj
      run: dotnet publish ./api-pipelining-practice-project/api-pipelining-practice-project.csproj -c Release -o ./publish --runtime win-x86 --self-contained false

    - name: Deploy via WebDeploy
      uses: rasmusbuchholdt/simply-web-deploy@main
      with:
        website-name: 'site56641'
        server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
        server-username: 'site56641'
        server-password: ${{ secrets.SERVER_PASSWORD }}
        source-path: ./publish/