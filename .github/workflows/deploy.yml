name: Build and Deploy to MonsterASP

on:
  push:
    branches: [ "development" ]

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Check if you use 8.0.x or 9.0.x in your csproj

    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Publish API
      run: dotnet publish -c Release -o ./publish --runtime win-x86 --self-contained false

    - name: Deploy via WebDeploy
      # This is a more stable action for 2026 WebDeployments
      uses: rasmusbuchholdt/simply-web-deploy@main
      with:
        server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
        website-name: ${{ secrets.WEBSITE_NAME }}
        server-username: ${{ secrets.SERVER_USERNAME }}
        server-password: ${{ secrets.SERVER_PASSWORD }}
        source-path: ./publish